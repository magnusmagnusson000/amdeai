# Install as /etc/systemd/system/ollama.service.d/gpu.conf
# Then: sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# gfx1151 (Radeon 8060S): bundled Ollama ROCm backend crashes at GPU discovery.
# Vulkan via RADV works; enable it explicitly.

[Service]
EnvironmentFile=-/etc/environment
Environment="OLLAMA_VULKAN=1"
