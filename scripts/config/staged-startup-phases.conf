# Staged cluster startup phases (gfx1151 / RKE2 + ArgoCD).
# One ArgoCD Application per line within a phase; blank line separates phases.
# Apps are synced sequentially inside each phase, then STAGED_STARTUP_PAUSE_SEC
# elapses before the next phase (memory / amdgpu SVM settle time).
#
# Sourced by scripts/staged-cluster-startup.sh — do not execute directly.

# Phase 1 — secrets / PKI / CRDs foundation
STAGED_PHASE_1=(
  openbao
  openbao-config
  prometheus-crds
  cert-manager
  external-secrets
)

# Phase 2 — core platform operators
STAGED_PHASE_2=(
  argocd
  cnpg-operator
  envoy-gateway
  kyverno
  opentelemetry-operator
  kserve-crds
)

# Phase 3 — auth / policy / observability base
STAGED_PHASE_3=(
  cluster-auth-config
  kyverno-policies-base
  external-secrets-config
  gitea-config
  kaiwo-crds
  otel-lgtm-stack
  envoy-gateway-config
)

# Phase 4 — databases & messaging (before JVM services)
STAGED_PHASE_4=(
  airm-infra-cnpg
  aiwb-infra-cnpg
  airm-infra-external-secrets
  aiwb-infra-external-secrets
  rabbitmq
  airm-infra-rabbitmq
  minio-operator
)

# Phase 5 — Keycloak alone (memory-patched to 4Gi before sync)
STAGED_PHASE_5=(
  keycloak
)

# Phase 6 — cluster-auth gateway (needs Keycloak)
STAGED_PHASE_6=(
  cluster-auth
)

# Phase 7 — ML operators (no inference workloads)
STAGED_PHASE_7=(
  keda
  kedify-otel
  kueue
  kueue-config
  appwrapper
  kuberay-operator
  kaiwo
  aim-engine-crds
  aim-engine
  kserve
  kaiwo-config
)

# Phase 8 — networking / Git / storage tenants
STAGED_PHASE_8=(
  metallb
  argocd-config
  gitea
  minio-tenant-config
  minio-tenant
)

# Phase 9 — user-facing UIs (last)
STAGED_PHASE_9=(
  aiwb
  airm
)

# Namespaces whose Deployments are scaled to 0 at boot before phased bring-up.
STAGED_QUIESCE_NAMESPACES=(
  keycloak
  aiwb
  airm
  demo
  aim-system
  kaiwo-system
  kserve-system
  minio-operator
  minio-tenant-default
)
