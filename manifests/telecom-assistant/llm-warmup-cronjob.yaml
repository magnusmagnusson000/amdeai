# Keeps Qwen3.6-27B AIM hot between page loads (vLLM first-token latency).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-warmup
  labels:
    app: llm-warmup
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: llm-warmup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: warmup
              image: curlimages/curl:8.18.0
              env:
                - name: LLM_URL
                  value: "http://qwen3-6-27b-llm.default.svc.cluster.local/v1/chat/completions"
                - name: LLM_MODEL
                  value: "Qwen/Qwen3.6-27B"
              command:
                - sh
                - -c
                - |
                  set -e
                  curl -sf --max-time 120 -X POST "${LLM_URL}" \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer no-key-required" \
                    -d "{\"model\":\"${LLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}"
