# Stable in-cluster OpenAI endpoint for Telecom Assistant → Qwen3.6-27B.
# No selector: Endpoints are populated by scripts/ensure-qwen-llm-bridge.sh from
# whichever AIMService predictor is Ready (Workbench catalog Deploy or scripts/10).
# Agent LLM_BASE_URL: http://qwen3-6-27b-llm.default.svc.cluster.local/v1
apiVersion: v1
kind: Service
metadata:
  name: qwen3-6-27b-llm
  namespace: default
  labels:
    app.kubernetes.io/component: telecom-llm-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
