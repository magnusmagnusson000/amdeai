# Stable in-cluster OpenAI endpoint for Telecom Assistant → Qwen AIM (MoE or dense).
# No selector: Endpoints are populated by scripts/ensure-qwen-llm-bridge.sh from
# whichever AIMService predictor is Ready (Workbench catalog Deploy or scripts/11).
# Agent LLM_BASE_URL: http://qwen-llm.default.svc.cluster.local/v1
apiVersion: v1
kind: Service
metadata:
  name: qwen-llm
  namespace: default
  labels:
    app.kubernetes.io/component: telecom-llm-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
