# EAI gfx1151 / Bloom RKE2 overrides for AMD telecom-assistant blueprint.
# Chart: ~/eai-build/solution-blueprints/solution-blueprints/telecom-assistant
# Adaptation rationale: docs/TELECOM_ASSISTANT_GFX1151_ADAPTATION.md

# Avoid Docker Hub rate limits when images are pre-imported into RKE2 containerd.
imagePullPolicy: IfNotPresent

# --- LLM: DiffusionGemma 26B via stable bridge (Workbench catalog Deploy or scripts/12) ---
# Deploy DiffusionGemma from AI Workbench first, then run scripts/09-telecom-assistant.sh.
# ensure-diffusiongemma-llm-bridge.sh discovers the Ready predictor by catalog model label.
# Qwen bridge (qwen-llm) remains available for optional fallback — not used by default.
llm:
  existingService: "http://diffusiongemma-llm.default.svc.cluster.local"

mainServices:
  agent:
    image:
      repository: telecom-agent
      tag: local
    imagePullPolicy: Never
    # Silero VAD + LiveKit worker pool need >2Gi on gfx1151 with DiffusionGemma LLM.
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    env:
      LLM_MODEL: "google/diffusiongemma-26B-A4B-it"
      LLM_API_KEY: "no-key-required"
      LLM_ENABLE_THINKING: "true"
  bssgateway:
    image:
      repository: telecom-bssgateway
      tag: local
    imagePullPolicy: Never
  frontend:
    image:
      repository: telecom-frontend
      tag: local
    imagePullPolicy: Never
    env:
      # Satisfies Helm/stunner validation; ignored when LIVEKIT_PROXY_ENABLED=1.
      LIVEKIT_URL: "ws://localhost:7880"
      LIVEKIT_PROXY_ENABLED: "1"
      LIVEKIT_UPSTREAM: "http://eai-telecom-livekit:80"
      LLM_WARMUP_URL: "http://diffusiongemma-llm.default.svc.cluster.local"
      LLM_MODEL: "google/diffusiongemma-26B-A4B-it"
      LLM_ENABLE_THINKING: "true"

# --- Storage: Bloom cluster provides mlstorage (local-path provisioner) ---
storage:
  ephemeral:
    storageClassName: mlstorage

chromadb:
  persistence:
    storageClassName: mlstorage
    size: 10Gi

# --- Embedding: default infinity gfx942 image fails on gfx1151; run CPU ---
embedding:
  image: "michaelf34/infinity:latest"
  gpus: 0
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

# --- STT/TTS: CPU-only lightweight services (faster-whisper + Kokoro-82M) ---
# Deployed via manifests/telecom-assistant/{stt,tts}-deployment.yaml (see deploy script).
# Upstream Qwen GPU sub-charts are disabled; agent points at telecom-stt/telecom-tts.
stt:
  existingService: "telecom-stt"
  replicas: 0

tts:
  existingService: "telecom-tts"
  replicas: 0

# --- Ingress: blueprint targets kgateway-system; we use Envoy + port-forward first ---
http_route:
  enabled: false

# STUNner operator is cluster-scoped (install-prerequisites.sh); per-release gateway stays on.
stunner:
  enabled: true

# --- Infra: GHCR mirror avoids Docker Hub 429 on libredesk/libredesk ---
infraServices:
  libredesk:
    image: ghcr.io/abhinavxd/libredesk:v1.0.3-amd64
