apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-stt
  labels:
    app: telecom-stt
    app.kubernetes.io/component: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telecom-stt
  template:
    metadata:
      labels:
        app: telecom-stt
        app.kubernetes.io/component: stt
    spec:
      containers:
        - name: stt
          image: telecom-stt-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: WHISPER_MODEL
              value: "small"
            - name: WHISPER_DEVICE
              value: "cpu"
            - name: WHISPER_COMPUTE_TYPE
              value: "int8"
            - name: WHISPER_LANGUAGE
              value: "en"
            - name: WHISPER_BEAM_SIZE
              value: "2"
            - name: LOG_LEVEL
              value: "INFO"
            - name: HF_HOME
              value: /app/hf_cache
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telecom-stt
  labels:
    app: telecom-stt
    app.kubernetes.io/component: stt
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8001
  selector:
    app: telecom-stt
