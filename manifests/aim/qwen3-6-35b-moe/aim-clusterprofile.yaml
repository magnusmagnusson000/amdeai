# AIMClusterProfile (v1alpha2) for Qwen/Qwen3.6-35B-A3B (MoE) on gfx1151 / R9700.
#
# Key MoE tuning differences vs the qwen3-6-27b-r9700-gfx1151-latency profile:
#   - gpu-memory-utilization: 0.65  (was 0.55 — 35B MoE BF16 weights ≈ 70 GiB;
#                                    0.65 × 128 GiB = 83.2 GiB headroom for weights + KV cache)
#   - max-num-seqs: 8               (was 16 — less KV-cache budget after larger weight footprint)
#   - speculative-config points to Qwen3.6-35B-A4B cache path
#   - All AITER flags remain 0 — AITER MoE in particular is unreliable on gfx1151
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: qwen3-6-35b-moe-r9700-gfx1151-latency
  labels:
    aim.eai.amd.com/origin: manual
    aim.eai.amd.com/platform: gfx1151
spec:
  aimId: qwen/qwen3-6-35b-moe
  modelId: Qwen/Qwen3.6-35B-A3B
  profileId: qwen3-6-35b-moe-r9700-gfx1151-latency
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  acceleratorModel: R9700
  acceleratorType: gpu
  acceleratorCount: 1
  resources:
    requests:
      cpu: "4"
      memory: 64Gi
  image: ${REGISTRY_HOST}/aim-gfx1151-qwen3-6-35b-moe:0.11-therock
  engineArgs:
    tensor-parallel-size: "1"
    gpu-memory-utilization: "0.65"
    max-model-len: "32768"
    max-num-seqs: "8"
    attention-backend: ROCM_ATTN
    enforce-eager: true
    trust-remote-code: true
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_coder
    speculative-config: '{"model":"/workspace/cache/Qwen/Qwen3.6-35B-A3B","num_speculative_tokens":1}'
  engineEnv:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    HSA_ENABLE_SDMA: "0"
    MIOPEN_FIND_ENFORCE: "1"
    PYTORCH_ROCM_ARCH: gfx1151
    GPU_ARCHS: gfx1151
    TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    VLLM_ROCM_USE_AITER: "0"
    VLLM_ROCM_USE_AITER_MHA: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "0"
    VLLM_ROCM_USE_AITER_LINEAR: "0"
    VLLM_ROCM_USE_AITER_MOE: "0"
    VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
    VLLM_DO_NOT_TRACK: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
  containerEnv:
    - name: AIM_GPU_MODEL
      value: R9700
    - name: AIM_GPU_COUNT
      value: "1"
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1151
    - name: VLLM_USE_V1
      value: "0"
  modelSources:
    - modelId: Qwen/Qwen3.6-35B-A3B
      sourceUri: hf://Qwen/Qwen3.6-35B-A3B
