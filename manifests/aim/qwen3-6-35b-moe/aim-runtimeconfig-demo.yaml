apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: default
  namespace: demo
spec:
  routing:
    enabled: true
    gatewayRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: https
      namespace: envoy-gateway-system
    pathTemplate: '{.metadata.namespace}/{.metadata.labels[''airm.silogen.ai/workload-id'']}'
    requestTimeout: 30m
