# AIMClusterProfile (v1alpha2) for Phi-4-mini-instruct on gfx1151 / R9700.
#
# This is the cluster-scoped runtime configuration that AMD's discovery controller
# would normally auto-generate from OCI image labels. Since no official
# amdenterpriseai/aim-microsoft-phi-4-mini image exists, we author it manually.
#
# Key gfx1151 constraints:
#   - acceleratorModel: R9700  requires scripts/03b-gfx1151-aim-labels.sh
#   - containerEnv.AIM_GPU_MODEL: R9700  fixes aim-runtime profile auto-selection
#     (without it the container sees "Detected GPU: None" and crashes)
#   - All VLLM_ROCM_USE_AITER*: "0"  — AITER kernels are CDNA-only on 0.11.0
#   - attention-backend: ROCM_ATTN    — Radeon fallback backend
#   - enforce-eager: "true"           — avoids HIP graph capture hang on gfx1151
#
# See: docs/GFX1151_GPT_OSS_AIM_PROFILE.md  (root cause analysis)
#      docs/call-flows/03b-gfx1151-aim-labels.md  (node label mapping)
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: phi4-mini-r9700-gfx1151-latency
  labels:
    aim.eai.amd.com/origin: manual
    aim.eai.amd.com/platform: gfx1151
spec:
  aimId: microsoft/phi-4-mini-instruct
  modelId: microsoft/Phi-4-mini-instruct
  profileId: phi4-mini-r9700-gfx1151-latency
  engine: vllm
  metric: latency
  precision: fp16
  type: general
  primary: true

  acceleratorModel: R9700
  acceleratorType: gpu
  acceleratorCount: 1
  resources:
    requests:
      cpu: "4"
      memory: 32Gi

  # Base image — no embedded model; operator constructs vLLM command from engineArgs.
  # amdenterpriseai/aim-base:0.11 is the public Docker Hub base used by AIM system pods.
  # Tag is 0.11 (not 0.11.0) — the .0 variant does not exist on Docker Hub.
  image: amdenterpriseai/aim-base:0.11

  engineArgs:
    tensor-parallel-size: "1"
    gpu-memory-utilization: "0.40"
    max-model-len: "8192"
    max-num-seqs: "64"
    attention-backend: ROCM_ATTN
    enforce-eager: "true"

  # vLLM / ROCm process env — AITER disabled (CDNA-only), Radeon fallback path
  engineEnv:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    HSA_ENABLE_SDMA: "0"
    MIOPEN_FIND_ENFORCE: "1"
    PYTORCH_ROCM_ARCH: gfx1151
    GPU_ARCHS: gfx1151
    TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    VLLM_ROCM_USE_AITER: "0"
    VLLM_ROCM_USE_AITER_MHA: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "0"
    VLLM_ROCM_USE_AITER_LINEAR: "0"
    VLLM_ROCM_USE_AITER_MOE: "0"
    VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
    VLLM_DO_NOT_TRACK: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"

  # Pod-level env — fixes aim-runtime profile auto-selection ("Detected GPU: None").
  # containerEnv uses K8s []EnvVar list syntax (unlike engineEnv which is a free-form map).
  containerEnv:
    - name: AIM_GPU_MODEL
      value: R9700
    - name: AIM_GPU_COUNT
      value: "1"
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1151
    - name: VLLM_USE_V1
      value: "0"

  # Weight source — public HF repo, no token required.
  # The AIM operator reads this to create an AIMArtifact download job when
  # an AIMService referencing this profile is applied.
  modelSources:
    - modelId: microsoft/Phi-4-mini-instruct
      sourceUri: hf://microsoft/Phi-4-mini-instruct
