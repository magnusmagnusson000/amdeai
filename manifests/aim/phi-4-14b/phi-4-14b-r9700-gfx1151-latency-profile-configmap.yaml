# aim-runtime profile YAML — mounted at /workspace/aim-runtime/profiles/
apiVersion: v1
kind: ConfigMap
metadata:
  name: phi-4-14b-r9700-gfx1151-latency-profile
  namespace: demo
  labels:
    aim.eai.amd.com/platform: gfx1151
    aim.eai.amd.com/profile-id: phi-4-14b-r9700-gfx1151-latency
data:
  phi-4-14b-r9700-gfx1151-latency.yaml: |
    metadata:
      engine: vllm
      gpu: R9700
      gpu_count: 1
      manual_selection_only: false
      metric: latency
      precision: fp16
      type: general
    aim_id: microsoft/phi-4-14b
    model_id: microsoft/phi-4
    engine_args:
      tensor-parallel-size: 1
      gpu-memory-utilization: 0.38
      max-model-len: 8192
      max-num-seqs: 32
      attention-backend: ROCM_ATTN
      enforce-eager: true
      enable-auto-tool-choice: true
      tool-call-parser: phi4_mini_json
    env_vars:
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      HSA_ENABLE_SDMA: "0"
      MIOPEN_FIND_ENFORCE: "1"
      PYTORCH_ROCM_ARCH: gfx1151
      GPU_ARCHS: gfx1151
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_RMSNORM: "0"
      VLLM_ROCM_USE_AITER_LINEAR: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
      VLLM_DO_NOT_TRACK: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
