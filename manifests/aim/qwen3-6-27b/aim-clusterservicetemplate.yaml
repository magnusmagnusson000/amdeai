# AIMClusterServiceTemplate for Qwen/Qwen3.6-27B on gfx1151 / R9700.
#
# Required for the AI Workbench catalog Deploy button. AIMClusterModel alone is
# not enough — the UI filters to Ready templates whose GPU matches the cluster.
# Auto-discovery is disabled, so this template is authored manually.
#
# With the custom gfx1151 AIM image (images/aim-gfx1151-qwen3-6-27b/Dockerfile),
# Workbench Deploy now creates a fully managed AIMService that runs inference
# end-to-end on gfx1151 — no separate Deployment needed.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMClusterServiceTemplate
metadata:
  name: qwen3-6-27b-r9700-gfx1151-latency
  labels:
    aim.eai.amd.com/origin: manual
    aim.eai.amd.com/platform: gfx1151
    aim.eai.amd.com/cluster-model.name: qwen-qwen3-6-27b
spec:
  modelName: qwen-qwen3-6-27b
  aimId: qwen/qwen3-6-27b
  modelId: Qwen/Qwen3.6-27B
  metric: latency
  precision: bf16
  hardware:
    gpu:
      model: R9700
      requests: 1
  env:
    - name: AIM_GPU_MODEL
      value: R9700
    - name: AIM_GPU_COUNT
      value: "1"
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: MIOPEN_FIND_ENFORCE
      value: "1"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1151
    - name: TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL
      value: "1"
  # Use the cluster AIMClusterProfile — do NOT set customProfile here (causes
  # AIM_PROFILE_ID=custom/... path that aim-runtime cannot resolve on gfx1151).
  profileId: qwen3-6-27b-r9700-gfx1151-latency
