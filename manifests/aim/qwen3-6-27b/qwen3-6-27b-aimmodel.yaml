# AIMModel registration for Qwen/Qwen3.6-27B on gfx1151.
#
# Registers the in-cluster vLLM deployment (qwen3-6-27b-vllm) in AI Workbench
# via external-endpoint annotation. NODE_IP is patched at deploy time by
# scripts/10-qwen3-6-27b.sh.
#
# Endpoint: http://<NODE_IP>:30401/v1 (NodePort 30401 → qwen3-6-27b-vllm:8000)
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMModel
metadata:
  name: qwen3-6-27b-vllm
  namespace: default
  annotations:
    aim.eai.amd.com/display-name: Qwen3.6-27B (gfx1151 vLLM)
    aim.eai.amd.com/external-endpoint: http://192.168.32.13:30401
    aim.eai.amd.com/model-id: qwen-qwen3-6-27b
spec:
  discovery:
    extractMetadata: false
    createServiceTemplates: false
  image: amdenterpriseai/aim-base:0.11
  imageMetadata:
    baseImageRef: docker.io/kyuz0/vllm-therock-gfx1151:stable
    model:
      canonicalName: Qwen/Qwen3.6-27B
      hfTokenRequired: false
      tags:
        - text-generation
        - chat
        - instruction
        - reasoning
      descriptionFull: >
        Qwen3.6-27B dense hybrid-attention model served via vLLM on gfx1151
        (Strix Halo / R9700) using TheRock nightly PyTorch build.
        OpenAI-compatible endpoint. Requires --trust-remote-code.
        No HuggingFace token required.
