# Qwen/Qwen3.6-27B vLLM deployment for gfx1151 (Strix Halo / R9700).
#
# Uses kyuz0/vllm-therock-gfx1151:stable — PyTorch compiled for gfx1151 via
# TheRock nightlies. Weights are served from the AIMArtifact PVC created by
# AIMService qwen3-6-27b (see scripts/10-qwen3-6-27b.sh).
#
# Qwen3.6-27B requires --trust-remote-code (GatedDeltaNet hybrid architecture)
# and --reasoning-parser qwen3 for thinking-token parsing.
# MTP speculative decoding uses the built-in Qwen3_5MTP draft head (~1.7x TPS on gfx1151).
#
# Endpoint (in-cluster): http://qwen3-6-27b-vllm.default.svc.cluster.local:8000/v1
# NodePort: 30401
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-6-27b-vllm
  namespace: default
  labels:
    app: qwen3-6-27b-vllm
    aim.eai.amd.com/platform: gfx1151
    aim.eai.amd.com/model: qwen-qwen3-6-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-6-27b-vllm
  template:
    metadata:
      labels:
        app: qwen3-6-27b-vllm
        aim.eai.amd.com/platform: gfx1151
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/aim-accelerator.R9700
                    operator: Exists
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            # Patched at deploy time by scripts/10-qwen3-6-27b.sh if different
            claimName: hf---qwen-qwen3-6-27b-b18388332b-cache-08d3b032
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      containers:
        - name: vllm
          image: kyuz0/vllm-therock-gfx1151:stable
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - /model
            - --served-model-name
            - Qwen/Qwen3.6-27B
            - --trust-remote-code
            - --reasoning-parser
            - qwen3
            - --attention-backend
            - ROCM_ATTN
            - --enforce-eager
            - "true"
            - --gpu-memory-utilization
            - "0.55"
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "16"
            - --tensor-parallel-size
            - "1"
            - --speculative-config
            - '{"model":"/model","num_speculative_tokens":1}'
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          env:
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: HSA_ENABLE_SDMA
              value: "0"
            - name: MIOPEN_FIND_ENFORCE
              value: "1"
            - name: PYTORCH_ROCM_ARCH
              value: gfx1151
            - name: GPU_ARCHS
              value: gfx1151
            - name: TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL
              value: "1"
            - name: VLLM_ROCM_USE_AITER
              value: "0"
            - name: VLLM_ROCM_USE_AITER_MHA
              value: "0"
            - name: VLLM_ROCM_USE_AITER_RMSNORM
              value: "0"
            - name: VLLM_ROCM_USE_AITER_LINEAR
              value: "0"
            - name: VLLM_ROCM_USE_AITER_MOE
              value: "0"
            - name: VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION
              value: "0"
            - name: VLLM_DO_NOT_TRACK
              value: "1"
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "900"
            - name: VLLM_USE_V1
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: model-weights
              mountPath: /model
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              amd.com/gpu: "1"
            requests:
              amd.com/gpu: "1"
              cpu: "4"
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 420
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-6-27b-vllm
  namespace: default
  labels:
    app: qwen3-6-27b-vllm
    aim.eai.amd.com/platform: gfx1151
spec:
  selector:
    app: qwen3-6-27b-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30401
  type: NodePort
