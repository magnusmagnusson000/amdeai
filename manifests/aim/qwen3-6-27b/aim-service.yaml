# AIMService (v1alpha2) — managed deploy trigger for Qwen/Qwen3.6-27B on gfx1151.
#
# Deploy in the demo namespace (AI Workbench catalog path: /demo/models/aim-catalog).
# Applying this manifest causes the AIM operator to:
#   1. Resolve qwen3-6-27b-r9700-gfx1151-latency (AIMClusterServiceTemplate / Profile)
#   2. Reuse the shared AIMArtifact cache for hf://Qwen/Qwen3.6-27B (~51.8 GiB)
#   3. Spin up the InferenceService predictor using the custom gfx1151 AIM image
#
# Full managed path: AIMService → InferenceService → aim-runtime → vLLM → gfx1151
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen3-6-27b
  namespace: demo
spec:
  model:
    name: qwen-qwen3-6-27b
  template:
    name: qwen3-6-27b-r9700-gfx1151-latency
  caching:
    mode: Shared
  replicas: 1
  env:
    - name: AIM_ID
      value: qwen/qwen3-6-27b
