# AIMClusterProfile (v1alpha2) for Qwen/Qwen3.6-27B on gfx1151 / R9700.
#
# Qwen3.6-27B uses a hybrid GatedDeltaNet architecture (48 linear-attention +
# 16 gated-attention layers). vLLM requires --trust-remote-code and
# --reasoning-parser qwen3 at inference time.
#
# Key gfx1151 constraints:
#   - acceleratorModel: R9700  requires scripts/03b-gfx1151-aim-labels.sh
#   - precision: bf16         Qwen3.6-27B weights are BF16 (~55.6 GiB)
#   - gpu-memory-utilization: 0.55  conservative for 128 GiB unified memory
#   - max-model-len: 32768    practical limit on gfx1151 (model supports 262K)
#   - max-num-seqs: 16        reduced from 32 for MTP speculative decoding stability
#
# image: 192.168.32.13:32000/aim-gfx1151-qwen3-6-27b:0.11-therock
#   Custom image built from images/aim-gfx1151-qwen3-6-27b/Dockerfile.
#   Layers aim-runtime (pure Python) from aim-base:0.11 onto kyuz0 vLLM stack.
#   This is what enables the managed AIMService flow on gfx1151.
#
# See: docs/GFX1151_CUSTOM_AIM_DEPLOYMENT_GUIDE.md
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: qwen3-6-27b-r9700-gfx1151-latency
  labels:
    aim.eai.amd.com/origin: manual
    aim.eai.amd.com/platform: gfx1151
spec:
  aimId: qwen/qwen3-6-27b
  modelId: Qwen/Qwen3.6-27B
  profileId: qwen3-6-27b-r9700-gfx1151-latency
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true

  acceleratorModel: R9700
  acceleratorType: gpu
  acceleratorCount: 1
  resources:
    requests:
      cpu: "4"
      memory: 64Gi

  image: 192.168.32.13:32000/aim-gfx1151-qwen3-6-27b:0.11-therock

  engineArgs:
    tensor-parallel-size: "1"
    gpu-memory-utilization: "0.55"
    max-model-len: "32768"
    max-num-seqs: "16"
    attention-backend: ROCM_ATTN
    enforce-eager: "true"
    trust-remote-code: "true"
    reasoning-parser: qwen3
    speculative-config: '{"model":"/workspace/cache/Qwen/Qwen3.6-27B","num_speculative_tokens":1}'

  engineEnv:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    HSA_ENABLE_SDMA: "0"
    MIOPEN_FIND_ENFORCE: "1"
    PYTORCH_ROCM_ARCH: gfx1151
    GPU_ARCHS: gfx1151
    TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    VLLM_ROCM_USE_AITER: "0"
    VLLM_ROCM_USE_AITER_MHA: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "0"
    VLLM_ROCM_USE_AITER_LINEAR: "0"
    VLLM_ROCM_USE_AITER_MOE: "0"
    VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
    VLLM_DO_NOT_TRACK: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"

  containerEnv:
    - name: AIM_GPU_MODEL
      value: R9700
    - name: AIM_GPU_COUNT
      value: "1"
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1151
    - name: VLLM_USE_V1
      value: "0"

  modelSources:
    - modelId: Qwen/Qwen3.6-27B
      sourceUri: hf://Qwen/Qwen3.6-27B
