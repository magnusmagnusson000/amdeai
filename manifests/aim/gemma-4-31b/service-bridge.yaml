# Cluster → host bridge for Gemma 4 31B llama-server (:8081).
# Default namespace is default (AI Workbench catalog). Use namespace: demo for telecom.
# Substitute NODE_IP before apply (see docs/GEMMA4_AIM_BLOOM_POST_INSTALL.md).
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-31b-local
  namespace: default
  labels:
    app: gemma-4-31b-local
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gemma-4-31b-local
  namespace: default
subsets:
  - addresses:
      - ip: ${NODE_IP}
    ports:
      - name: http
        port: 8081
