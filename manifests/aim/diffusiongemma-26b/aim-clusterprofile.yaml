# AIMClusterProfile (v1alpha2) for google/diffusiongemma-26B-A4B-it on gfx1151 / R9700.
#
# DiffusionGemma uses bidirectional attention and block-based iterative denoising.
# Upstream vLLM recommends TRITON_ATTN for DiffusionGemma (ROCM_ATTN fails: head_size not supported).
#
# Key tuning:
#   - max-model-len: 8192       practical single-GPU limit on 128 GiB unified memory
#   - gpu-memory-utilization: 0.60  leaves headroom for desktop/k8s on 128 GiB UMA (~97 GiB free typical)
#   - enforce-eager: true         match proven Qwen gfx1151 profile; avoids HIP graph capture stalls
#   - enable-chunked-prefill      required for diffusion (compatible with VLLM_USE_V1=0)
#   - hf-overrides / diffusion-config  vLLM diffusion sampler settings
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: diffusiongemma-26b-r9700-gfx1151-latency
  labels:
    aim.eai.amd.com/origin: manual
    aim.eai.amd.com/platform: gfx1151
spec:
  aimId: google/diffusiongemma-26b
  modelId: google/diffusiongemma-26B-A4B-it
  profileId: diffusiongemma-26b-r9700-gfx1151-latency
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true

  acceleratorModel: R9700
  acceleratorType: gpu
  acceleratorCount: 1
  resources:
    requests:
      cpu: "4"
      memory: 64Gi

  image: ${REGISTRY_HOST}/aim-gfx1151-diffusiongemma-26b:0.11-therock

  engineArgs:
    tensor-parallel-size: "1"
    gpu-memory-utilization: "0.60"
    max-model-len: "8192"
    max-num-seqs: "4"
    attention-backend: TRITON_ATTN
    enforce-eager: true
    trust-remote-code: true
    enable-chunked-prefill: true
    generation-config: vllm
    hf-overrides: '{"diffusion_sampler": "entropy_bound", "diffusion_entropy_bound": 0.15}'
    diffusion-config: '{"canvas_length": 256}'
    enable-auto-tool-choice: "true"
    tool-call-parser: gemma4
    reasoning-parser: gemma4

  engineEnv:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"
    HSA_ENABLE_SDMA: "0"
    MIOPEN_FIND_ENFORCE: "1"
    PYTORCH_ROCM_ARCH: gfx1151
    GPU_ARCHS: gfx1151
    TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    VLLM_ROCM_USE_AITER: "0"
    VLLM_ROCM_USE_AITER_MHA: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "0"
    VLLM_ROCM_USE_AITER_LINEAR: "0"
    VLLM_ROCM_USE_AITER_MOE: "0"
    VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "0"
    VLLM_DO_NOT_TRACK: "1"
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"

  containerEnv:
    - name: AIM_GPU_MODEL
      value: R9700
    - name: AIM_GPU_COUNT
      value: "1"
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: HSA_ENABLE_SDMA
      value: "0"
    - name: HSA_XNACK
      value: "0"
    - name: PYTORCH_ROCM_ARCH
      value: gfx1151
    - name: PYTORCH_HIP_ALLOC_CONF
      value: expandable_segments:False
    - name: VLLM_USE_V1
      value: "0"

  modelSources:
    - modelId: google/diffusiongemma-26B-A4B-it
      sourceUri: hf://google/diffusiongemma-26B-A4B-it
