# Cluster Bloom reference config — Asus Z13 / Strix Halo (gfx1151)
# DOMAIN = short hostname (stable across DHCP). See scripts/migrate-domain-hostname.sh.

DOMAIN: "magnus-rog-flow-z13"
FIRST_NODE: true
GPU_NODE: true
GPU_GFX1151: true
CLUSTER_SIZE: small
NO_DISKS_FOR_CLUSTER: true
SKIP_RANCHER_PARTITION_CHECK: true
CERT_OPTION: generate
CLUSTERFORGE_RELEASE: "latest"
# ClusterForge bootstraps its own ArgoCD (Helm chart). Bloom's core-install ArgoCD conflicts with it.
INSTALL_ARGOCD: false
PRELOAD_IMAGES: ""
# DOCKERHUB_USER: ""
# DOCKERHUB_TOKEN: ""
